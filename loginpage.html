<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://kit.fontawesome.com/55fa51d470.js" crossorigin="anonymous"></script>
    <title>Jnnkey PMS</title>


</head>
<body>

    <section>


        <div class="container mt-5">

            <form onsubmit="return alertbtn()" action="" method="POST" enctype="multipart/form-data" 
            class="border-1 align-items-center">
                <div class="mt-3 mb-3">
                    <label for="username" class="form-label">Username:</label>
                    <input id="username" type="text" class="form-control" name="username" placeholder="Enter your username">
                    <span id="userError" style="color: red;"></span>
                </div>

                <div class="mt-3 mb-3" >
                    <label for="email" class="form-label">Email:</label>
                    <input id="email" type="email" class="form-control w-3" name="email" placeholder="Enter your email">
                    <span id="mailError" style="color: red;"></span>
                </div>
                <div class="mt-3 mb-3">
                    <label for="password" class="form-label">Password:</label>
                    <input id="password" type="password" class="form-control" name="password" placeholder="Enter your password">
                    <span id="passwordError" style="color: red;"></span>
                </div>

                <div >
                    <button class="btn btn-primary rounded-pill" type="submit">Login</button>
                </div>
            </form>

        </div>


    </section>


    <script src="index.js"></script>
    
</body>
</html>
